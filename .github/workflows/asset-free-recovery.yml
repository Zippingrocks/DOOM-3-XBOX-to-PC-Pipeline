name: Asset-free recovery proof

on:
  push:
    branches: [main, checkpoint-002-retail-mapx]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-and-synthetic-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Read exact source commit from metadata lock
        id: lock
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path('evidence/checkpoint-086-toolchain-lock.json').read_text())
          commit = lock['source_commit']
          assert re.fullmatch('[0-9a-f]{40}', commit)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('commit=' + commit + '\n')
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Zippingrocks/doom3-gpl-xbox-reconstruction
          ref: ${{ steps.lock.outputs.commit }}
          path: reconstruction
          persist-credentials: false
      - name: Verify pipeline safety tests
        run: python -E -s -B -m unittest discover -s tests -p "test_*.py" -q
      - name: Verify pinned source, metadata-only recipe, and synthetic tests
        run: python -E -s -B tools/verify_recovery_checkout.py --source reconstruction --tests
      # Intentionally no game data, installed-game paths, secrets, artifacts,
      # conversions, native builds, runtime loads or uploads in this workflow.
